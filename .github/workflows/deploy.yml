# Каждый push в main: проверки, сборка статического сайта и публикация на GitHub Pages.
# Перед первым запуском: Settings → Pages → Source: GitHub Actions.
name: Публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна публикация за раз; начатую не прерываем, чтобы сайт не остался наполовину обновлённым.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Типы и тесты
        run: pnpm check

      # Сайт открывается по адресу https://<логин>.github.io/<репозиторий>/,
      # а для репозитория <логин>.github.io — с корня домена.
      - name: Адрес сайта
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Сборка
        run: pnpm --filter @pravovukha/web build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: "1"

      # Без этого файла GitHub Pages прогоняет сайт через Jekyll и прячет папку _next.
      - name: Отключение Jekyll
        run: touch apps/web/out/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
